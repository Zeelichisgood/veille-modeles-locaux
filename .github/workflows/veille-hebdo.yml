# =====================================================================
# Veille hebdomadaire des modèles de langage locaux
# - cron : chaque MARDI à 03h00 UTC, soit entre 3h et 6h du matin en
#   heure française toute l'année (UTC+1 en hiver -> 4h, UTC+2 en
#   été -> 5h). Le cron GitHub ne connaît que l'UTC : 03h00 UTC est le
#   choix qui reste dans la fenêtre 3h-6h FR même avec le changement
#   d'heure (02h00-03h59 UTC conviendrait aussi).
# - déclenchement manuel : onglet "Actions" du dépôt sur GitHub
# Coût : 0 € (dépôt public = minutes GitHub Actions gratuites).
# Aucune clé API requise : le script n'interroge que des API publiques.
# =====================================================================

name: Veille hebdomadaire des modèles locaux

on:
  schedule:
    - cron: "0 3 * * 2"        # mardi 03h00 UTC = 4h (hiver) / 5h (été) heure française
  workflow_dispatch:           # déclenchement manuel depuis l'onglet Actions

# Un seul run à la fois : si un run manuel chevauche le cron, le plus récent gagne.
concurrency:
  group: veille-hebdo
  cancel-in-progress: false

permissions:
  contents: write              # nécessaire pour committer le rapport

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances (requests, pyyaml, pytest)
        run: pip install requests pyyaml pytest

      - name: Lancer la veille (génère rapports/AAAA-MM-JJ.md + met à jour historique.json)
        run: python3 veille.py

      - name: Lancer les tests du filtrage
        run: python3 -m pytest tests/ -q

      - name: Committer le rapport et l'historique
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || git pull --rebase origin master || true
          git add rapports/ historique.json JOURNAL.md
          if git diff --cached --quiet; then
            echo "Aucun changement cette semaine : rien à committer."
          else
            git commit -m "Rapport de veille du $(date -u +%F)" -m "Generated by Mistral Vibe." -m "Co-Authored-By: Mistral Vibe <vibe@mistral.ai>"
            git push
          fi
